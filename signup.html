<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BraDevs | SignUp</title>
        <link rel="stylesheet" href="./assets/css/pages/signup/signup.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="background"></div>
        <div class="background-blur"></div>
        <div class="page-loader">
            <div class="loader"></div>
        </div>
        <main class="container">
           <form>
                <h1>
                    Bra<span>Devs</span>
                </h1>
                <div class="icons">
                    <a href="https://github.com/Tokizao" target="_blank" class="git-hub">
                        <i class="bi bi-github"></i>
                    </a>
                </div>
                <div class="input-box">
                    <input placeholder="Usuário" type="email">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="input-box">
                    <input placeholder="Senha" type="password">
                    <i class="bi bi-shield-fill"></i>
                </div>
                <div class="input-box">
                    <input placeholder="Confirmar Senha" type="password">
                    <i class="bi bi-shield-fill-check"></i>
                </div>
                <button class="signin" type="submit">Sign In</button>
                <div class="signin-link">
                    <p>
                        Já tem uma conta? 
                        <a class="signin-text" href="index.html">Entrar</a>
                    </p>
                </div>
           </form>
        </main>
        <script src="./assets/js/loading.js" defer></script>
    </body>
</html>
